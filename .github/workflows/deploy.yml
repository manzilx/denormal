name: Deploy to Hostinger

# Builds the static site and uploads it to Hostinger over FTP. Runs on a
# private repo without any paid plan — the earlier GitHub Pages limitation was
# about Pages hosting, not about Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys writing to public_html at once would interleave files.
concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Falls back to the value in astro.config.mjs; set the repository
          # variable only to publish somewhere other than the live domain.
          SITE_URL: ${{ vars.SITE_URL }}

      # Catches the failure that is invisible until it is live: a build whose
      # canonical host is wrong, or one missing the server config.
      - name: Verify the artifact before uploading
        run: |
          set -euo pipefail
          test -f dist/index.html      || { echo "::error::no index.html"; exit 1; }
          test -f dist/404.html        || { echo "::error::no 404.html"; exit 1; }
          test -f dist/.htaccess       || { echo "::error::.htaccess missing — Apache config would not ship"; exit 1; }
          test -f dist/sitemap-index.xml || { echo "::error::no sitemap"; exit 1; }
          grep -q 'rel="canonical" href="https://denormal.in/"' dist/index.html \
            || { echo "::error::canonical URL is not https://denormal.in/"; exit 1; }
          echo "artifact ok — $(find dist -type f | wc -l) files"

      - name: Upload to public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./public_html/
          # The action keeps a manifest on the server and uploads only what
          # changed. Never enable dangerous-clean-slate here: it wipes
          # public_html, including anything Hostinger put there.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
