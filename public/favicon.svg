<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <!-- The logo's ruler as the square mark: a bracket in three equal cells,
       ticks full height, the first cell filled orange. Same construction as
       the wordmark lockup (experience.css, "Logo"), thickened to read at 16px.
       On the #18181A ground it reads in both browser themes. -->
  <rect width="120" height="120" fill="#18181A"/>
  <g transform="translate(14,40)" fill="#F7F7F7">
    <rect x="0" y="32" width="92" height="8"/>
    <rect x="0" y="0" width="8" height="40"/>
    <rect x="28" y="0" width="8" height="40"/>
    <rect x="56" y="0" width="8" height="40"/>
    <rect x="84" y="0" width="8" height="40"/>
    <rect x="8" y="0" width="20" height="32" fill="#EA580C"/>
  </g>
</svg>
